<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Code Editor</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 20px;
        background-color: #f7f9fa;
      }
      .container {
        display: flex;
        gap: 20px;
        margin-top: 20px;
        height: 75vh;
      }
      .editor-side {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .box {
        display: flex;
        flex-direction: column;
        flex: 1;
      }
      textarea {
        flex: 1;
        min-height: 100px;
        font-family: monospace;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        resize: vertical;
      }
      .output-side {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      iframe {
        flex: 1;
        border: 1px solid #ccc;
        background: white;
        border-radius: 4px;
      }

      /* Styling for the new Import/Export Action Buttons */
      .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        color: white;
        cursor: pointer;
        font-weight: bold;
        margin-left: 10px;
      }
      .btn-import {
        background-color: #28a745;
      }
      .btn-export {
        background-color: #007bff;
      }
      .btn:hover {
        opacity: 0.9;
      }

      #saveToast {
        visibility: hidden;
        min-width: 250px;
        background-color: #28a745;
        color: #fff;
        text-align: center;
        border-radius: 4px;
        padding: 16px;
        position: fixed;
        z-index: 1000;
        right: 30px;
        top: 30px;
        font-size: 17px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      #saveToast.show {
        visibility: visible;
        animation:
          fadein 0.5s,
          fadeout 0.5s 2.5s;
      }
      @keyframes fadein {
        from {
          top: 0;
          opacity: 0;
        }
        to {
          top: 30px;
          opacity: 1;
        }
      }
      @keyframes fadeout {
        from {
          top: 30px;
          opacity: 1;
        }
        to {
          top: 0;
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div
      style="
        display: flex;
        align-items: center;
        background-color: blue;
        color: white;
        border-radius: 50px;
        padding: 15px;
        display: inline-flex;
      "
    >
      Project Name:
      <input
        type="text"
        id="project_name"
        onkeyup="saveName()"
        placeholder="Project Title"
        style="margin-left: 10px"
      />

      <!-- New Clickable Backup Buttons -->
      <button class="btn btn-import" onclick="triggerImport()">
        Import File (Ctrl+I)
      </button>
      <button class="btn btn-export" onclick="exportProject()">
        Export File (Ctrl+S)
      </button>
    </div>

    <!-- Hidden native file input picker -->
    <input
      type="file"
      id="fileImporter"
      accept=".html"
      style="display: none"
      onchange="handleFileImport(event)"
    />

    <div id="saveToast">Saved Successfully!</div>

    <div class="container">
      <div class="editor-side">
        <div class="box">
          <label><strong>HTML</strong></label>
          <textarea id="htmlCode" onkeyup="runEditor()"></textarea>
        </div>
        <div class="box">
          <label><strong>CSS</strong></label>
          <textarea id="cssCode" onkeyup="runEditor()"></textarea>
        </div>
        <div class="box">
          <label><strong>JavaScript</strong></label>
          <textarea id="jsCode" onkeyup="runEditor()"></textarea>
        </div>
      </div>

      <div class="output-side">
        <label><strong>Output</strong></label>
        <iframe id="output-window"></iframe>
      </div>
    </div>

    <script>
      // Global hotkey interceptor configuration
      window.addEventListener(
        "keydown",
        function (event) {
          var key = event.key.toLowerCase();

          if ((event.ctrlKey || event.metaKey) && key === "s") {
            event.preventDefault();
            event.stopPropagation();
            exportProject();
          }

          if ((event.ctrlKey || event.metaKey) && key === "i") {
            event.preventDefault();
            event.stopPropagation();
            triggerImport();
          }
        },
        true,
      );

      document.addEventListener("DOMContentLoaded", function () {
        var savedName = sessionStorage.getItem("project_name");
        if (savedName) {
          document.getElementById("project_name").value = savedName;
        }
        runEditor();
      });

      function saveName() {
        var inputVal = document.getElementById("project_name").value;
        sessionStorage.setItem("project_name", inputVal);
      }

      // Encapsulated call wrapper to securely fire the hidden upload window open
      function triggerImport() {
        var importer = document.getElementById("fileImporter");
        if (importer) {
          importer.click();
        }
      }

      function runEditor() {
        var htmlValue = document.getElementById("htmlCode").value;
        var cssValue = document.getElementById("cssCode").value;
        var jsValue = document.getElementById("jsCode").value;

        var iframeElement = document.getElementById("output-window");
        if (!iframeElement) return;

        var outputDoc = iframeElement.contentWindow.document;

        outputDoc.open();
        outputDoc.write(
          htmlValue +
            "<style>" +
            cssValue +
            "</style>" +
            "<script>" +
            jsValue +
            "<\/script>",
        );
        outputDoc.close();
      }

      function exportProject() {
        var htmlValue = document.getElementById("htmlCode").value;
        var cssValue = document.getElementById("cssCode").value;
        var jsValue = document.getElementById("jsCode").value;

        var headOpen =
          '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<title>Exported Project</title>\n<style id="exported-css">\n';
        var headClose =
          "\n" +
          "</" +
          "style>\n" +
          "</" +
          'head>\n<body>\n<div id="exported-html">\n';
        var scriptOpen = "\n" + "</" + 'div>\n<script id="exported-js">\n';
        var scriptClose =
          "\n" + "</" + "script>\n" + "</" + "body>\n" + "</" + "html>";

        var builtHTML =
          headOpen +
          cssValue +
          headClose +
          htmlValue +
          scriptOpen +
          jsValue +
          scriptClose;

        var blob = new Blob([builtHTML], { type: "text/html" });
        var downloadUrl = URL.createObjectURL(blob);

        var downloadLink = document.createElement("a");
        var currentName = document.getElementById("project_name").value.trim();
        var finalFileName = currentName ? currentName + ".html" : "index.html";

        downloadLink.download = finalFileName;
        downloadLink.href = downloadUrl;

        document.body.appendChild(downloadLink);
        downloadLink.click();

        document.body.removeChild(downloadLink);
        URL.revokeObjectURL(downloadUrl);

        showToast("Saved successfully as " + finalFileName, "#28a745");
      }

      function handleFileImport(event) {
        var files = event.target.files;
        if (!files || files.length === 0) return;

        var file = files[0];
        var fileNameWithoutExtension = file.name.replace(/\.[^/.]+$/, "");
        document.getElementById("project_name").value =
          fileNameWithoutExtension;
        saveName();

        var reader = new FileReader();
        reader.onload = function (e) {
          var fileContent = e.target.result;
          var parser = new DOMParser();
          var doc = parser.parseFromString(fileContent, "text/html");

          var cssTag =
            doc.getElementById("exported-css") || doc.querySelector("style");
          var cssContent = cssTag ? cssTag.innerHTML : "";

          var htmlWrapper = doc.getElementById("exported-html");
          var htmlContent = "";
          if (htmlWrapper) {
            htmlContent = htmlWrapper.innerHTML;
          } else {
            var cloneBody = doc.body ? doc.body.cloneNode(true) : null;
            if (cloneBody) {
              var scripts = cloneBody.querySelectorAll("script");
              scripts.forEach(function (s) {
                s.remove();
              });
              var styles = cloneBody.querySelectorAll("style");
              styles.forEach(function (s) {
                s.remove();
              });
              htmlContent = cloneBody.innerHTML;
            }
          }

          var jsTag =
            doc.getElementById("exported-js") ||
            doc.querySelector("script:not([src])");
          var jsContent = jsTag ? jsTag.innerHTML : "";

          document.getElementById("htmlCode").value = htmlContent.trim();
          document.getElementById("cssCode").value = cssContent.trim();
          document.getElementById("jsCode").value = jsContent.trim();

          runEditor();
          showToast("Imported successfully!", "#0056b3");
          event.target.value = "";
        };

        reader.readAsText(file);
      }

      function showToast(message, bgColor) {
        var toast = document.getElementById("saveToast");
        toast.style.backgroundColor = bgColor;
        toast.textContent = message;
        toast.className = "show";
        setTimeout(function () {
          toast.className = toast.className.replace("show", "");
        }, 3000);
      }
    </script>
  </body>
</html>
